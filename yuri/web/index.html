<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>yuri4iPhone</title>
<link rel="icon" href="/static/icon.svg">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="shell">
  <aside class="side">
    <div class="brand"><img src="/static/icon.svg" alt=""><span>yuri<b>4</b>iPhone</span></div>
    <nav>
      <button class="nav on" data-view="dash"><svg class="i" viewBox="0 0 24 24"><rect x="7" y="2.5" width="10" height="19" rx="2.5"/><line x1="11" y1="18.5" x2="13" y2="18.5"/></svg><span data-t="navDash"></span></button>
      <button class="nav" data-view="custom"><svg class="i" viewBox="0 0 24 24"><path d="M12 2.5l2.6 5.6 6.1.7-4.5 4.1 1.2 6-5.4-3-5.4 3 1.2-6-4.5-4.1 6.1-.7z"/></svg><span data-t="navCustom"></span></button>
      <button class="nav" data-view="apps"><svg class="i" viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.5"/></svg><span data-t="navApps"></span></button>
      <button class="nav" data-view="files"><svg class="i" viewBox="0 0 24 24"><path d="M3.5 7.5a2 2 0 0 1 2-2h4l2 2.5h7a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z"/></svg><span data-t="navFiles"></span></button>
      <button class="nav" data-view="logs"><svg class="i" viewBox="0 0 24 24"><path d="M5 3.5h9l5 5v12a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V4.5a1 1 0 0 1 1-1z"/><path d="M13.5 3.5v5h5M8 13h8M8 16.5h8"/></svg><span data-t="navLogs"></span></button>
    </nav>
    <div class="side-foot">
      <div id="side-device" class="side-device"></div>
      <div class="langs themes"><button data-theme-set="system" data-t="themeSystem"></button><button data-theme-set="light" data-t="themeLight"></button><button data-theme-set="black" data-t="themeBlack"></button></div>
      <div class="langs"><button data-lang="en">EN</button><button data-lang="ru">RU</button><button data-lang="zh">中文</button></div>
      <a href="https://murk-sus.github.io/donate/" target="_blank" rel="noopener" class="donate">♥ <span data-t="donate"></span></a>
    </div>
  </aside>

  <main>
    <section id="view-dash" class="view on">
      <div class="topbar"><h1 data-t="dashTitle"></h1><button class="btn" id="dash-refresh"><svg class="i" viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-.9 4.5"/><path d="M20 4.5V11h-6.5"/></svg><span data-t="refresh"></span></button></div>
      <div class="body" id="dash"></div>
    </section>

    <section id="view-custom" class="view">
      <div class="topbar"><h1 data-t="customTitle"></h1></div>
      <div class="body">
        <div id="custom-banner"></div>
        <div id="custom-grid" class="tool-grid"></div>
      </div>
    </section>

    <section id="view-apps" class="view">
      <div class="topbar"><h1 data-t="navApps"></h1>
        <div class="row-inline">
          <div class="seg"><button class="on" data-kind="User" data-t="userApps"></button><button data-kind="System" data-t="systemApps"></button></div>
          <label class="btn primary"><svg class="i" viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg><span data-t="installIpa"></span><input id="ipa-input" type="file" accept=".ipa,.tipa" hidden></label>
        </div>
      </div>
      <div class="body">
        <input id="apps-search" class="search" data-tp="search">
        <div id="job" class="card job" hidden></div>
        <div class="card" id="apps-list"></div>
      </div>
    </section>

    <section id="view-files" class="view">
      <div class="topbar"><h1 data-t="navFiles"></h1></div>
      <div class="body">
        <div id="crumbs" class="crumbs"></div>
        <div class="card" id="files-list"></div>
      </div>
    </section>

    <section id="view-logs" class="view">
      <div class="topbar"><h1 data-t="navLogs"></h1>
        <div class="row-inline">
          <button id="log-toggle" class="btn primary" data-t="startLog"></button>
          <input id="log-filter" class="search" style="margin:0;width:200px" data-tp="logFilter">
          <button id="log-clear" class="btn" data-t="clear"></button>
        </div>
      </div>
      <div class="body"><div id="logs" class="logs"></div></div>
    </section>
  </main>
</div>
<div id="toast" class="toast" hidden></div>
<dialog id="prompt"><form method="dialog"><h3 id="prompt-title"></h3><input id="prompt-input" autocomplete="off"><menu><button value="cancel" data-t="cancel"></button><button value="ok" class="btn primary" data-t="ok"></button></menu></form></dialog>
<script type="module" src="/static/app.js"></script>
</body>
</html>
